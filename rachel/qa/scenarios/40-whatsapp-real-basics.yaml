name: whatsapp-real-basics
transport: whatsapp
tags: [channel]
turns:
  - send: reset
    expect: {contains: ["21 or older"]}
  - send: "yes"
    expect: {contains: ["delivery address"]}
  - send: "425 W 53rd St, New York, NY 10019"
    expect: {contains: ["10019"]}
  - send: "do you have Tito's"
    expect: {matches: "1[.)] .*\\$\\d", not_contains: ["<http"]}
  - send: "I'd like 3 bottles of Tito's 750ml and 2 bottles of Whispering Angel rosé"
    expect: {contains: ["Tito", "Whispering", "Product total"], not_contains: ["<http", "&amp;"]}
