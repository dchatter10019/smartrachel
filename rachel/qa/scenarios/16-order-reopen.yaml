name: order-reopen
# After an order is placed the cart is empty. There is no order-update API: a change to the placed order (paid or not)
# is escalated to bevvi-support and the customer told so (DC, Oct 4) — never a reopen question, never a silent re-order.
tags: [smoke]
stop_on_fail: true
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a kim crawford"
  - send: "1"
  - send: "2"
  - send: "ok lets go with this and order"
  - send: "QA Tester"
  - send: "same"
  - send: "9175550100"
  - send: "tomorrow at 5 pm ET"
  - send: "none"
    expect: {contains: ["tip for your driver", "10%", "no tip"], not_contains: ["Shall I go ahead"]}
  - send: "no tip"
    expect: {contains: ["Tip (none): $0.00", "Shall I go ahead"]}
  - send: "yes"
    expect: {matches: "placed|confirmed|submitted", log_contains: ["basket cleared"]}
  - send: "can you add 2 more bottles to that order?"
    expect:
      contains: ["support team has been made aware", "update the order"]
      not_contains: ["reopen", "direct-checkout"]
      log_contains: ["items — change request not sent (QA/dry-run"]
  - send: "actually make it 3 instead"
    expect: {contains: ["support team has been made aware"], not_contains: ["reopen"]}
