name: order-reopen
# DC (Oct 28): "once a order is created, if the user asks for any change of the order, fetch the last order and apply the
# change, seamlessly". No order-update API: the placed order comes back into checkout, the change is applied, the updated
# summary is shown in the same reply and one "yes" places the corrected order, naming the order it replaces. (Oct 4-28 a
# change was emailed to bevvi-support instead.)
tags: [smoke]
stop_on_fail: true
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a kim crawford"
  - send: "1"
  - send: "2"
  - send: "ok lets go with this and order"
  - send: "QA Tester"
  - send: "same"
  - send: "9175550100"
  - send: "tomorrow at 5 pm ET"
  - send: "none"
    expect: {contains: ["tip for your driver", "10%", "no tip"], not_contains: ["Shall I go ahead"]}
  - send: "no tip"
    expect: {contains: ["Tip (none): $0.00", "Shall I go ahead"]}
  - send: "yes"
    expect: {matches: "placed|confirmed|submitted", log_contains: ["basket cleared"]}
  - send: "can you add 2 more bottles to that order?"
    expect:
      contains: ["Kim Crawford", "replaces order #", "Order Summary", "Shall I go ahead"]
      not_contains: ["support team has been made aware", "should I reopen", "direct-checkout"]
      matches: "(?i)Kim Crawford Prosecco - 750 ML x4 — \\$17\\.59 ea = \\$70\\.36"
      log_contains: ["[order-change] order", "[order-change] updated summary added"]
  - send: "yes"
    expect:
      matches: "placed|confirmed|submitted"
      contains: ["replaces your earlier order #"]
