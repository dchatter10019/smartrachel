name: search-spell-proseco
tags: [ux, search-normalize]
# Nov 20 (DC): search-text normalization before every product search (rachel/search-normalize.js) — zero-result spell check: "proseco" finds nothing, retried once as "prosecco" (Nov 20 QA: "I couldn't find proseco")
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
    expect: {contains: ["10019"]}
  - send: "proseco"
    expect:
      contains: ["Prosecco"]
      not_contains: ["couldn't find proseco"]
      log_contains: ['"proseco" -> "prosecco" (spell check, zero results)']
