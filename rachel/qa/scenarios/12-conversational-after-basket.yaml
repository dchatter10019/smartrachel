name: conversational-after-basket
tags: [smoke]
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "Need to arrange a party for 30 people budget 2000 for 3 hours need beer, wine and spirits"
    expect: {contains: ["drink most"], not_contains: ["Product total"]}
  - send: "mostly spirits"
    expect: {contains: ["Product total"], log_not_contains: ["supply check FAILED"], log_contains: ["supply check OK", "serving_mix=", "[buildPackage] serving mix from customer -> spirits 50%"]}
  - send: "Sounds like liquor/mixed drinks will be the bigger preference here. So is it possible to have two brands of middle to top shelf vodka, tequila, and rum?"
    expect: {matches: "(?i)vodka", not_contains: ["could not resolve", "couldn't match"]}
