name: search-negative-domaine-bousquet
tags: [ux, search-normalize]
# Nov 20 (DC): search-text normalization before every product search (rachel/search-normalize.js) — NEGATIVE: "domaine bousquet malbec" is a real wine (not carried at 10019) — never rewritten (no alias, no abbreviation, no spell fix to "bouquet")
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
    expect: {contains: ["10019"]}
  - send: "domaine bousquet malbec"
    expect:
      not_contains: ["Bouquet", "Dom Perignon"]
      log_not_contains: ['[search-normalize] "domaine bousquet malbec" ->', '(spell check, zero results)', '(alias)', '(abbreviation)']
