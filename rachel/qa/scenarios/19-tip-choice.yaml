name: tip-choice
# The customer chooses the driver tip: asked once before the order summary, changeable any
# time, and sent with the order (rachel.js enforces the approved tip_amount on place_order).
tags: [smoke]
stop_on_fail: true
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a kim crawford"
  # by name, not "1": the LLM's list order varies. (The Illuminate $18.69 left the catalog Oct 11 and every later answer
  # landed a step late.) Tip amounts are matched by shape, not price: the bottle went $16.42 -> $17.04 on Oct 29 and the
  # pinned "$4.93" failed every nightly and every fixer smoke run (F-0090/F-0091/F-0095 couldn't be offered).
  - send: "the Marlborough Sauvignon Blanc 750 ml"
    expect: {contains: ["Marlborough"]}
  - send: "2"
  - send: "place the order"
  - send: "QA Tester"
  - send: "same"
  - send: "9175550100"
  - send: "tomorrow at 5 pm ET"
  - send: "none"
    expect: {contains: ["tip for your driver"], matches: "15% \\(\\$\\d+\\.\\d\\d\\)", log_contains: ["[tip] asking before the summary"]}
  - send: "what do people usually tip?"
    expect: {contains: ["up to you", "How much would you like to tip"], not_contains: ["Shall I go ahead"]}
  - send: "7"
    expect: {contains: ["7% or $7"]}
  - send: "dollars"
    expect: {contains: ["Tip: $7.00", "Shall I go ahead"], log_contains: ["[tip] customer chose $7.00"]}
  - send: "actually make the tip 15%"
    expect: {contains: ["Shall I go ahead"], matches: "Tip \\(15%\\): \\$\\d+\\.\\d\\d", not_contains: ["$7.00"]}
  - send: "yes"
    expect: {matches: "placed|confirmed|submitted", log_contains: ["place_order tip_amount", "from the approved summary"]}
