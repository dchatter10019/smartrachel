name: search-negative-cab-franc
tags: [ux, search-normalize]
# Nov 20 (DC): search-text normalization before every product search (rachel/search-normalize.js) — NEGATIVE: "cab franc" is Cabernet Franc — "cab" is never expanded to "cabernet" before "franc"
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
    expect: {contains: ["10019"]}
  - send: "cab franc"
    expect:
      log_not_contains: ['[search-normalize] "cab franc" ->', 'cabernet franc" (abbreviation)', '(alias)']
