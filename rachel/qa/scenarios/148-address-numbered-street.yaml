name: address-numbered-street
# Nov 16 (DC on Slack): "1345 Avenue of the Americas, New York, NY 10105" was geocoded to "1345 6th Ave, New York, NY 10105"
# and the zip-only check (a LETTER after the house number) asked "What's the street address in 10105?" four times. A
# numbered street ("6th Ave", "42nd St") is a street. Same /chat address step for Slack, WhatsApp, email and rachel_chat.
tags: [ux]
turns:
  - send: reset
  - send: "yes"
  - send: "1345 Avenue of the Americas\nNew York, NY 10105"
    expect:
      not_contains: ["I need the full street address"]
      matches: "(?i)1345 (6th Ave|Avenue of the Americas)"
      log_not_contains: ["[addr] zip only, no street"]
  # A street in another zip than the one typed is asked about, never stored silently (Nov 16, DC: "425 W 53rd St, New York,
  # NY 10105" was accepted — 425 W 53rd St is in 10019 — and the order went to the wrong street).
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10105"
    expect:
      contains: ["Just to check the address", "10019"]
      not_contains: ["delivering to 425 W 53rd St, New York, NY 10105"]
      log_contains: ["[geocode] zip mismatch — asking the customer"]
  - send: "1345 Avenue of the Americas, New York, NY 10105"
    expect:
      matches: "(?i)delivering to 1345 (6th Ave|Avenue of the Americas)"
  # Google's zip LABEL can be wrong: "1580 Park Avenue ... 10029" is labeled 10019 by Google, but its point is in East Harlem
  # (10029). Asked only when the street is nearer Google's zip than the typed one (server.js zipMismatchReal).
  - send: reset
  - send: "yes"
  - send: "1580 Park Avenue, New York, NY 10029"
    expect:
      not_contains: ["Just to check the address"]
      matches: "(?i)delivering to 1580 Park Ave"
      log_contains: ["Google's zip label looks wrong, keeping what was typed"]
