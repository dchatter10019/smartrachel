name: ux-quantity-offscript
# Off-script quantities. Found: "enough for 20 people" switched to an event build (asked
# hours and budget), and "make it a dozen" re-showed the pick list after the pick was made.
tags: [ux]
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a kim crawford"
  - send: "1"
    expect: {contains: ["How many"]}
  - send: "enough for 20 people"
    expect: {not_contains: ["budget"]}
  - send: "make it a dozen"
    expect: {contains: ["12"], not_contains: ["Which one would you like"]}
