name: search-alias-dom-first-message
tags: [ux, search-normalize]
# Nov 20 (DC): search-text normalization before every product search (rachel/search-normalize.js) — a short alias as the FIRST message ("DOM") is held through the age gate and searched — never a greeting (Nov 20 QA: "I'm here and ready to help!")
turns:
  - send: reset
  - send: "DOM"
    expect: {contains: ["I have your request"]}
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
    expect:
      contains: ["Dom P"]
      not_contains: ["ready to help"]
      log_contains: ['"DOM" -> "Dom Perignon" (alias) — routed to add-item']
