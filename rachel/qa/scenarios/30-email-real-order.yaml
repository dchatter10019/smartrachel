name: email-real-order
transport: email
tags: [channel]
turns:
  - send: |
      Hi Rachel,

      I'd like to order 3 bottles of Tito's Handmade Vodka 750ml and 2 bottles of Whispering Angel rosé,
      delivered to 425 W 53rd St, New York, NY 10019 on October 15.

      Thanks,
      QA
    expect: {contains: ["21 or older"]}
  - send: "Yes, I am."
    expect: {contains: ["10019", "Tito", "Whispering", "Product total"]}
  - send: "Make it 5 bottles of Tito's please."
    expect: {matches: "5x.*Tito", not_contains: ["21 or older"]}
