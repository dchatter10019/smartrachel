name: search-alias-dom-p
tags: [ux, search-normalize]
# Nov 20 (DC): search-text normalization before every product search (rachel/search-normalize.js) — alias at the ready step: "dom p" -> Dom Perignon, routed to add-item in code
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
    expect: {contains: ["10019"]}
  - send: "dom p"
    expect:
      contains: ["Dom P"]
      not_contains: ["ready to help", "couldn't find"]
      log_contains: ['"dom p" -> "Dom Perignon" (alias) — routed to add-item']
