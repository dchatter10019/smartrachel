name: trailer-gone
fresh: true
tags: [smoke, cta]
# The generic four-action trailer is gone everywhere. An informational answer after a basket either ends with
# the LLM's own question (no CTA) or with the order/proposal offer (DC, Sep 29: a basket and no question is
# never a dead end) — never the old trailer, never a search CTA.
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a kim crawford"
  - send: "1"
  - send: "2"
    expect: {not_contains: ["generate a PDF proposal, or make any changes", "see the estimated full price"]}
  - send: "what's the difference between Sauvignon Blanc and Pinot Grigio?"
    expect:
      not_contains: ["place the order, generate a PDF proposal", "make any changes", "ready to place the order"]
      log_not_contains: ["-> basket.offer_checkout", "-> search."]
