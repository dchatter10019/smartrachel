name: search-alias-veuve-at-zip-question
tags: [ux, search-normalize]
# Nov 20 (DC): a bare alias ("veuve") sent while Rachel waits on a question (here the zip question: the street is in
# 10019, not the 10105 typed) answers nothing and starts no search — the alias route runs only at the ready step.
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10105"
    expect: {contains: ["10019", "10105"]}
  - send: "veuve"
    expect:
      not_matches: "(?i)veuve clicquot|\\$\\d"
      log_not_contains: ['(alias)', '[add-item]', '[searchProducts]', '[searchWithFallbacks]']
