name: no-empty-reply
fresh: true
tags: [ux]
# Real bug (DC, Sep 29, Slack): after an event package, "no" to "add mixers?" got an LLM reply that was
# only the generic trailer; the CTA stripped it, the reply was EMPTY, Slack refused it (no_text) and the
# customer saw nothing — twice. Every reply must have text (cta.fallbackIfEmpty). Also: the event length is
# never assumed (rachel.js NEED_DURATION guard).
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a menu for an event for 50 people for 5000 dollars, need liquor, beer and wine"
  - send: "this event is more wine heavy drinkers"
    # hours were never given: the build is refused in code and Rachel asks (Sep 29 replay: LLM assumed 5 hours)
    expect: {matches: "(?i)how long", not_contains: ["Product total"]}
  - send: "2 hours"
    # never a downsell or a trim offer (DC: spend the whole budget); basket lines are never a numbered pick list
    expect:
      contains: ["Product total"]
      not_contains: ["fewer spirits", "trim it", "moderate tier", "more moderate"]
      not_matches: "(?m)^\\s*\\d{1,2}[.)]\\s+[^\\n]*\\b\\d{1,3}\\s*x\\s"
  - send: "do you think the quantities are enough for 50 guests?"
    expect: {matches: "\\S{3,}"}
  - send: "no"
    # never a dead end with a basket: offer the order or a PDF proposal (DC, Sep 29). When the previous reply already
    # offered them, this "no" declines that offer and the CTA layer rightly doesn't repeat it (cta-declined-not-repeated)
    # — then an open "what else" is the correct non-empty reply (F-0021: nightly Oct 6 flaked on which turn offered).
    expect: {matches: "(?i)PDF proposal|place the order|what else can I"}
  - send: "I see no replies"
    expect: {matches: "\\S{3,}"}
