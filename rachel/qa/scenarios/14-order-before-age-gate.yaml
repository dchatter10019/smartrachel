name: order-before-age-gate
tags: [smoke]
turns:
  - send: reset
  - send: "Hi Rachel, I'd like to order 3 bottles of Tito's Handmade Vodka 750ml and 2 bottles of Whispering Angel rosé, delivered to 425 W 53rd St, New York, NY 10019 on October 15. Thanks, QA"
    expect: {contains: ["21 or older"], matches: "request|got it|pick it up"}
  - send: "yes"
    expect: {contains: ["10019", "Tito", "Whispering", "Product total"]}
