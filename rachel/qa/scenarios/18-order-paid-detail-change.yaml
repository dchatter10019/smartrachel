name: order-paid-detail-change
# Oct 4, Foodie For All: after the order was placed, BJ wrote "I just made the payment. Could you please update the
# recipient name to Mara Miller ..." — Rachel re-sent the payment link and asked reopen/new. A payment report never gets
# the link again. Since Oct 28 (DC) a change is applied to the order and a corrected order placed — also when it was paid.
stop_on_fail: true
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a kim crawford"
  - send: "1"
  - send: "2"
  - send: "ok lets go with this and order"
  - send: "QA Tester"
  - send: "same"
  - send: "9175550100"
  - send: "tomorrow at 5 pm ET"
  - send: "none"
  - send: "10%"
  - send: "yes"
    expect: {matches: "placed|confirmed|submitted", log_contains: ["basket cleared"]}
  - send: "Hi, I just made the payment. Could you please update the name on the order to Mara Miller?"
    expect:
      contains: ["Mara Miller", "replaces order #", "Order Summary"]
      not_contains: ["direct-checkout", "reopen", "support team has been made aware"]
      log_contains: ["customer said PAID"]
  - send: "Also please change the phone number to 862-252-5077"
    expect:
      contains: ["8622525077", "Order Summary"]
      not_contains: ["direct-checkout", "reopen"]
  - send: "yes"
    expect:
      matches: "placed|confirmed|submitted"
      contains: ["replaces your earlier order #"]
      not_contains: ["pay only the new link"]
