name: search-not-carried-no-false-match
tags: [search]
# DC (Oct 6, claude.ai connector): "Green Chartreuse" came back as Johnnie Walker Green / Green Spot, "Rioja" led with an
# Argentine Malbec blend — product_query sorted the catalog's loose word matches by price. search-match.js now ranks by
# the query's words in product_query itself (every channel, the connector included).
turns:
  - send: reset
  - send: "yes"
  - send: "332 Pine St, San Francisco, CA 94104"
  - send: "do you have Green Chartreuse?"
    expect:
      not_contains: ["Johnnie Walker", "Green Spot", "Chablis"]
      matches: "(?i)(not|don't|do not|isn't|aren't).{0,60}(carr|stock|availab|have)"
      log_contains: ["NOT FOUND \"Green Chartreuse\""]
  - send: "what Rioja do you have?"
    expect:
      matches: "(?i)rioja"
      not_contains: ["Bodegas Caro"]
