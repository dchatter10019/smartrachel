name: add-confirm-costly
fresh: true
tags: [smoke]
# Real bug (DC, Sep 29, Slack): "I need an opus" put Opus One 2017 at $1,099.99 straight into the cart.
# A single search match at/above CONFIRM_ADD_PRICE ($200), or with a vintage the customer didn't name,
# is OFFERED with its price; a quantity reply adds it. A reply that isn't yes/quantity lets it lapse.
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  # Oct 22: the 2017 row is gone (Opus One 2018 1.5 L, same $1,099.99), and the classifier scores "I need an opus" add_item
  # 0.70 (< 0.8), so the LLM's search shows it; the search capture now holds it as the same offer ([product-discussed]
  # NOT captured) instead of putting it in the cart at 1x. Either route: offered, then the quantity adds it.
  # Nov 9: NYC now also lists Opus One 2022 750 mL ($577.49), so "an opus" is a two-option list — the size names the one
  # costly bottle; the price may be written without the comma.
  - send: "I need an opus one 1.5L"
    expect:
      matches: "Opus One[\\s\\S]*\\$1,?099\\.99"
      not_contains: ["Added"]
  - send: "2"
    expect:
      matches: "(?s)(Added 2x \\*?Opus One.*\\$2,?199\\.98|\\$2,?199\\.98.*Added 2x \\*?Opus One)"
      log_contains: ["[add-confirm] accepted"]
  - send: "show me my basket"
    expect:
      matches: "(?i)2\\s*x?\\s*[^\\n]*Opus One|Opus One[^\\n]*(?:qty|quantity|×|x)\\s*:?\\s*2"
  - send: "need a dom perignon luminous rose"
    expect:
      contains: ["Want me to add it?"]
  - send: "actually what's the cheapest champagne you have?"
    expect:
      not_contains: ["Added Dom"]
      log_contains: ["[add-confirm] offer for Dom Perignon"]
