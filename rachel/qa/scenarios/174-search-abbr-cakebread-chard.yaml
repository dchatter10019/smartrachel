name: search-abbr-cakebread-chard
tags: [ux, search-normalize]
# Nov 20 (DC): "cakebread chard" is a whole-message key in the approved alias file, so the ALIAS layer handles it (aliases
# come first) -> Cakebread Chardonnay. The abbreviation layer is covered by 180 ("rombauer chard 750ml", no alias key).
turns:
  - send: reset
  - send: "yes"
  - send: "332 Pine St, San Francisco, CA 94104"   # Nov 27: no Cakebread Chardonnay in the NYC stores any more
    expect: {contains: ["94104"]}
  - send: "cakebread chard"
    expect:
      contains: ["Cakebread"]
      matches: "(?i)cakebread[^\\n]*chardonnay"
      log_contains: ['"cakebread chard" -> "Cakebread Chardonnay" (alias)']
