name: order-new-after-placed
# After an order is placed, "add X" is a change to that order -> escalated to support (DC, Oct 4); asking for a NEW
# order starts a separate one: the placed items do not come back.
stop_on_fail: true
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a kim crawford"
  - send: "1"
  - send: "2"
  - send: "ok lets go with this and order"
  - send: "QA Tester"
  - send: "same"
  - send: "9175550100"
  - send: "tomorrow at 5 pm ET"
  - send: "none"
    expect: {contains: ["tip for your driver", "10%", "no tip"], not_contains: ["Shall I go ahead"]}
  - send: "10%"
    expect: {contains: ["Tip (10%)", "Shall I go ahead"]}
  - send: "yes"
    expect: {matches: "placed|confirmed|submitted", log_contains: ["basket cleared"]}
  - send: "add a bottle of Veuve Clicquot"
    expect: {contains: ["support team has been made aware"], not_contains: ["reopen"]}
  # A new order confirms the address first (DC, Oct 5); the request in the same message is held and replayed on "yes".
  - send: "start a new order please, I need a bottle of Veuve Clicquot"
    expect: {contains: ["425 W 53rd St", "again?"], not_contains: ["support team has been made aware"], log_contains: ["customer asked for a new order", "[new-order] asking whether to use the previous address"]}
  - send: "yes"
    expect: {contains: ["Veuve"], not_contains: ["Kim Crawford", "support team has been made aware"], log_contains: ["[new-order] address kept", "replaying the held request"]}
