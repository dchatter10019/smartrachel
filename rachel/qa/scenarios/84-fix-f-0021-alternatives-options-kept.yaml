name: fix-f-0021-alternatives-options-kept
# F-0021 (nightly Oct 6, proposal-alternatives): "two options for the prosecco, sauv blanc, and rose" went to the
# alternatives search (not product_query). Its results carry the original's name as `query`, no label, so no option
# group was kept: the PDF then said "I haven't shown you any options yet" right after Rachel listed six.
turns:
  - send: reset
  - send: "yes"
  - send: "132 W 32nd St, New York, NY 10001"
  - send: "3 x Kim Crawford Prosecco 750ml\n3 x Cloudy Bay Sauvignon Blanc 750ml\n3 x Rumor Provence Rose 750ml\n1 x Grey Goose Vodka 750ml"
    expect: {contains: ["Product total"]}
  - send: "Can you give me two alternatives for the prosecco, sauv blanc, and rose?"
    expect:
      log_contains: ["[options] kept for a proposal", "2 asked per item"]
  - send: "please send a pdf proposal and include those options"
    expect: {matches: "client|company"}
  - send: "QA Options Co"
  - send: "Oct 6th"
    expect:
      contains: ["proposal is ready", "Options listed in the PDF"]
      not_contains: ["haven't shown you any options"]
      log_contains: ["[options] listed in the PDF"]
      pdf_contains: ["CHANGE"]
