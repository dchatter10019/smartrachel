name: reprice-multipick
# "Find cheaper alternatives, same quantities" then a grouped pick ("Sauvignon Blanc 1, Pinot Noir 1,
# rosé 1"): each pick REPLACES its line keeping the quantity; a type with no alternative is
# reported. In smoke (DC, Sep 27) — it caught the grouped-heading and displayed-name bugs.
tags: [smoke]
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "5 bottles Sauvignon Blanc, 3 bottles Pinot Noir, 2 bottles rosé"
  - send: "find alternative wines around $20 a bottle, same quantities"
    # Sep 27: three varietal queries were rerouted to one generic "recommendation" — Rachel said no
    # Sauvignon Blanc or rosé existed near $20 (the NYC store has dozens). They must stay product_query.
    # Nov 25: the alternatives intent (with the $20 price) is the right tool for "find alternative wines" and the model now picks
    # it at times — allowed; the Sep 27 bug (one generic recommendation, "no Sauvignon Blanc near $20") stays forbidden
    expect: {judge: "lists alternative wine options with prices, grouped by category or numbered", log_not_contains: ["RECOMMENDATION ROUTING: product_query"]}
  - send: "Sauvignon Blanc 1, Pinot Noir 1, rosé 1"
    # Nov 25: the edit reader (model reads, code acts) now handles a per-section pick before the multi-pick resolver — either
    # reader's wording is accepted; the quantities and the replacement are what is checked
    expect: {contains: ["5x", "3x", "2x"], not_contains: ["could not resolve"], matches: "(?i)(updated basket[\\s\\S]*(replacing|no alternatives were listed))|(replaced:[\\s\\S]*→ 5x[\\s\\S]*→ 3x[\\s\\S]*→ 2x)"}
