name: search-negative-opus-one
tags: [ux, search-normalize]
# Nov 20 (DC): search-text normalization before every product search (rachel/search-normalize.js) — NEGATIVE: "opus one" is no alias ("opus" is, whole message only) and is found as typed — nothing rewritten
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
    expect: {contains: ["10019"]}
  - send: "opus one"
    expect:
      contains: ["Opus One"]
      log_not_contains: ['[search-normalize] "opus one" ->', '(alias)', '(spell check, zero results)']
