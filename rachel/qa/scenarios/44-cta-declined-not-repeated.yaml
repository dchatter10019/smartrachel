name: cta-declined-not-repeated
fresh: true
tags: [cta]
# A CTA the customer doesn't take is not offered again in the session.
turns:
  - send: reset
  - send: "yes"
  - send: "425 W 53rd St, New York, NY 10019"
  - send: "need a kim crawford"
  - send: "1"
  - send: "2"
    expect:
      contains: ["ready to place the order"]
      log_contains: ["-> basket.offer_checkout"]
  - send: "not yet"
    expect: {log_contains: ["[cta] previous basket.offer_checkout not taken"]}
  - send: "add 1 bottle of Tito's Handmade Vodka 750ml"
    expect:
      not_contains: ["ready to place the order"]
      log_not_contains: ["-> basket.offer_checkout"]
