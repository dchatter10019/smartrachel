<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bevvi Evals</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
header{padding:14px 24px;border-bottom:1px solid #e0e0dc;background:#fff;display:flex;align-items:center;gap:12px}
header h1{font-size:15px;font-weight:500}
a.nav{font-size:12px;color:#888;text-decoration:none;margin-left:4px}
.run-btn{margin-left:auto;padding:6px 16px;border-radius:6px;border:none;background:#1a1a1a;color:#fff;font-size:13px;cursor:pointer}
.run-btn:disabled{background:#888}
.summary{display:flex;gap:16px;padding:16px 24px;align-items:center;border-bottom:1px solid #e0e0dc;background:#fff}
.score{font-size:24px;font-weight:500}
.score-label{font-size:12px;color:#aaa;margin-top:2px}
.bar{flex:1;height:6px;background:#e0e0dc;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:#3B9E75;border-radius:3px;transition:width .3s}
.cases{padding:16px 24px;display:flex;flex-direction:column;gap:8px}
.case{background:#fff;border:1px solid #e0e0dc;border-radius:10px;overflow:hidden}
.case-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}
.case-hdr:hover{background:#f9f9f8}
.dot{width:8px;height:8px;border-radius:50%}
.dot.pass{background:#3B9E75}
.dot.fail{background:#E24B4A}
.dot.pend{background:#ddd}
.cid{font-size:11px;color:#aaa;font-family:monospace;min-width:44px}
.cname{font-size:13px;font-weight:500;flex:1}
.cstat{font-size:12px;font-weight:500}
.cstat.pass{color:#3B9E75}
.cstat.fail{color:#E24B4A}
.cbody{display:none;border-top:1px solid #e0e0dc}
.cbody.open{display:block}
.turn{padding:8px 16px;border-bottom:1px solid #f0f0ee;font-size:12px}
.turn:last-child{border-bottom:none}
.tu{color:#888;margin-bottom:3px}
.tr{font-family:monospace;font-size:11px;color:#333;margin-bottom:4px;white-space:pre-wrap;word-break:break-word}
.ck{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;margin:1px;font-family:monospace}
.ck.ok{background:#EAF3DE;color:#3B6D11}
.ck.fail{background:#FCEBEB;color:#A32D2D}
.log{margin:0 16px 12px;background:#0a0a0a;border-radius:6px;padding:10px;font-family:monospace;font-size:11px;color:#4eff91;height:180px;overflow-y:auto;display:none;white-space:pre-wrap}
.log.open{display:block}
.ts{font-size:11px;color:#aaa}
</style>
</head>
<body>
<header>
  <h1>Bevvi Evals</h1>
  <a class="nav" href="/">dashboard</a>
  <a class="nav" href="/flow">flow</a>
  <span class="ts" id="ts" style="margin-left:8px"></span>
  <button class="run-btn" id="runBtn" onclick="runAll()">Run all evals</button>
</header>
<div class="summary">
  <div>
    <div class="score" id="score">-</div>
    <div class="score-label">passing</div>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill" style="width:0"></div></div>
</div>
<div class="log" id="logBox"></div>
<div class="cases" id="cases"></div>
<script>
function toggle(id) {
  var b = document.getElementById('b' + id);
  if (b) b.classList.toggle('open');
}

function render(data) {
  var passed = 0;
  data.forEach(function(r) { if (r.passed) passed++; });
  var total = data.length;
  document.getElementById('score').textContent = passed + '/' + total;
  document.getElementById('barFill').style.width = (total ? Math.round(passed/total*100) : 0) + '%';
  if (data[0] && data[0].timestamp) {
    document.getElementById('ts').textContent = new Date(data[0].timestamp).toLocaleTimeString();
  }
  var el = document.getElementById('cases');
  el.innerHTML = '';
  data.forEach(function(r) {
    var sc = r.passed ? 'pass' : 'fail';
    var turns = '';
    (r.turns || []).forEach(function(t) {
      var cks = '';
      (t.checks || []).forEach(function(c) {
        var val = c.check.value || (c.check.values || []).join('|');
        cks += '<span class="ck ' + (c.passed ? 'ok' : 'fail') + '">' + (c.passed ? 'OK' : 'FAIL') + ' ' + String(val).slice(0, 40) + '</span>';
      });
      turns += '<div class="turn"><div class="tu">User: ' + String(t.user).slice(0,60) + '</div><div class="tr">' + String(t.response||'').slice(0,150) + '</div>' + cks + '</div>';
    });
    var html = '<div class="case"><div class="case-hdr" data-id="' + r.id + '" onclick="toggle(this.dataset.id)">' +
      '<div class="dot ' + sc + '"></div>' +
      '<span class="cid">' + r.id + '</span>' +
      '<span class="cname">' + String(r.name).replace(/[→]/g, '->') + '</span>' +
      '<span class="cstat ' + sc + '">' + (r.passed ? 'PASS' : 'FAIL') + '</span>' +
      '</div><div class="cbody" id="b' + r.id + '">' + turns + '</div></div>';
    el.innerHTML += html;
  });
}

function appendLog(text) {
  var box = document.getElementById('logBox');
  box.classList.add('open');
  box.textContent += text;
  box.scrollTop = box.scrollHeight;
}

function runAll() {
  var btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = 'Running...';
  var box = document.getElementById('logBox');
  box.textContent = '';
  box.classList.add('open');
  var xhr = new XMLHttpRequest();
  var lastLen = 0;
  xhr.open('POST', '/api/evals/run');
  xhr.onprogress = function() {
    var chunk = xhr.responseText.slice(lastLen);
    lastLen = xhr.responseText.length;
    chunk.split('\n').forEach(function(line) {
      if (line.indexOf('data: ') === 0) {
        try {
          var d = JSON.parse(line.slice(6));
          if (d === '__done__') { load(); }
          else { appendLog(d); }
        } catch(e) {}
      }
    });
  };
  xhr.onload = function() {
    btn.disabled = false;
    btn.textContent = 'Run all evals';
    load();
  };
  xhr.onerror = function() {
    btn.disabled = false;
    btn.textContent = 'Run all evals';
  };
  xhr.send();
}

function load() {
  fetch('/api/evals/results').then(function(r){ return r.json(); }).then(function(d) {
    if (d && d.length) render(d);
  });
}

load();
</script>
</body>
</html>
