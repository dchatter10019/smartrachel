<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bevvi Channel Capabilities</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
header{padding:14px 24px;border-bottom:1px solid #e0e0dc;background:#fff;display:flex;align-items:center;gap:12px}
header h1{font-size:15px;font-weight:500}
a.nav{font-size:12px;color:#888;text-decoration:none;margin-left:4px}
.save-btn{margin-left:auto;padding:6px 16px;border-radius:6px;border:none;background:#1a1a1a;color:#fff;font-size:13px;cursor:pointer}
.save-btn:disabled{background:#888}
.status{font-size:12px;color:#3B9E75;margin-left:8px}
.status.err{color:#E24B4A}
.grid{padding:16px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e0e0dc;border-radius:10px;padding:16px}
.card h2{font-size:14px;font-weight:500;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0ee;font-size:13px}
.row:last-of-type{border-bottom:none}
.row label{color:#333}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ddd;transition:.15s;border-radius:20px}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background-color:#fff;transition:.15s;border-radius:50%}
input:checked + .slider{background-color:#3B9E75}
input:checked + .slider:before{transform:translateX(16px)}
.msgs{margin-top:10px;padding-top:10px;border-top:1px solid #f0f0ee}
.msgs label{display:block;font-size:11px;color:#aaa;margin-bottom:4px;margin-top:8px}
.msgs textarea{width:100%;font-size:12px;font-family:inherit;padding:6px 8px;border:1px solid #e0e0dc;border-radius:6px;resize:vertical;min-height:44px;color:#333}
.msgs textarea:focus{outline:none;border-color:#aaa}
</style>
</head>
<body>
<header>
  <h1>Channel Capabilities</h1>
  <a class="nav" href="/">dashboard</a>
  <a class="nav" href="/evals">evals</a>
  <a class="nav" href="/flow">flow</a>
  <span class="status" id="status"></span>
  <button class="save-btn" id="saveBtn" onclick="saveAll()">Save changes</button>
</header>
<div class="grid" id="grid"></div>
<script>
var CAP_LABELS = {
  can_place_order: "Place order (checkout)",
  can_generate_proposal: "Generate PDF proposal",
  can_add_to_cart: "Add to cart",
  can_email_support: "Email support requests",
  requires_age_verification: "Requires age verification",
  mention_saved_address: "Mention saved delivery address on return"
};
var CAP_ORDER = ["requires_age_verification", "mention_saved_address", "can_add_to_cart", "can_place_order", "can_generate_proposal", "can_email_support"];
var config = {};

function render() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  Object.keys(config).forEach(function(channel) {
    var caps = config[channel];
    var rows = "";
    CAP_ORDER.forEach(function(key) {
      var checked = caps[key] ? "checked" : "";
      rows += '<div class="row"><label>' + CAP_LABELS[key] + '</label>' +
        '<label class="switch"><input type="checkbox" ' + checked + ' data-channel="' + channel + '" data-cap="' + key + '" onchange="onToggle(this)"><span class="slider"></span></label></div>';
    });
    grid.innerHTML += '<div class="card"><h2>' + channel + '</h2>' + rows + '</div>';
  });
}

function onToggle(el) {
  config[el.dataset.channel][el.dataset.cap] = el.checked;
}
function onText(el) {
  config[el.dataset.channel][el.dataset.field] = el.value;
}

function setStatus(text, isErr) {
  var s = document.getElementById("status");
  s.textContent = text;
  s.className = "status" + (isErr ? " err" : "");
  if (text) setTimeout(function() { s.textContent = ""; }, 3000);
}

function saveAll() {
  var btn = document.getElementById("saveBtn");
  btn.disabled = true;
  fetch("/api/channels/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(config)
  }).then(function(r) { return r.json(); }).then(function(d) {
    btn.disabled = false;
    if (d.success) setStatus("Saved — live, no restart needed");
    else setStatus("Error: " + d.error, true);
  }).catch(function(e) {
    btn.disabled = false;
    setStatus("Error: " + e.message, true);
  });
}

function load() {
  fetch("/api/channels/get").then(function(r) { return r.json(); }).then(function(d) {
    config = d;
    render();
  });
}

load();
</script>
</body>
</html>
